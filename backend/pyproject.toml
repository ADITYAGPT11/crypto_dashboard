[project]
name = "tcs"
version = "0.1.0"
description = "Trade confirmation system backend: market history, pattern detection and setup statistics"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "numpy>=2.0",
  "ta-lib>=0.6.5",
]

[project.scripts]
tcs = "tcs.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.8",
  "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcs"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]
# Line length is the formatter's job; exception names follow the domain (SourceUnavailable).
ignore = ["E501", "N818"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownLambdaType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# starlette nags about its httpx-based TestClient; nothing for us to change.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
