[project]
name = "tcs"
version = "0.1.0"
description = "Trade confirmation system backend: market data, pattern research and statistics."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162,<1",
  "uvicorn>=0.54,<1",
  "httpx>=0.28,<1",
  "numpy>=2.2,<3",
  # Chart and candlestick pattern detectors (MIT). Pinned: detector output is part of our stats.
  "ta-patterns==1.2.1",
]

[dependency-groups]
dev = ["pytest>=9.2", "ruff>=0.17", "pyright>=1.1.414"]

[project.scripts]
tcs-api = "tcs.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
