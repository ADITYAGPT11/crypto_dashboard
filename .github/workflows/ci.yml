name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format, lint and type-check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build (app + backend type-check)
        run: npm run build
      - name: Backend bundles
        run: npx vp build --ssr src/backend/index.ts --outDir dist-backend

  analysis-service:
    name: Python analysis service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - name: Install (Python 3.12, locked)
        run: uv sync --locked
      - name: Format and lint (ruff)
        run: uv run ruff format --check . && uv run ruff check .
      - name: Type-check (pyright, strict)
        run: uv run pyright
      - name: Tests (rules, invariants, golden snapshot, API, generated TS types)
        run: uv run pytest
